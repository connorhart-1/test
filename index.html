<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day!</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            font-family: 'Comic Sans MS', cursive;
            text-align: center;
            background-color: #f5e1da;
            background-size: cover;
            background-position: center;
            overflow: hidden;
            position: relative;
            transition: background-image 0.5s ease-in-out;
        }
        h1 {
            font-size: 3em;
            z-index: 2;
            color: #b22222;
            text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.3);
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }
        .buttons {
            margin-top: 20px;
            z-index: 2;
        }
        button {
            font-size: 1.5em;
            padding: 15px 25px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            transition: transform 0.3s ease, background-color 0.3s ease;
            font-family: 'Comic Sans MS', cursive;
        }
        .yes {
            background-color: #ff69b4;
            color: white;
            animation: glow 1s infinite alternate;
        }
        .no {
            background-color: #d9534f;
            color: white;
        }
        button:hover {
            transform: scale(1.2);
        }
        @keyframes glow {
            from { box-shadow: 0 0 5px #ff69b4; }
            to { box-shadow: 0 0 15px #ff1493; }
        }
    </style>
</head>
<body>
    <audio id="snoopyMusic" loop>
        <source src="snoopy-theme.mp3" type="audio/mpeg">
    </audio>
    <h1 id="question">Will you be my Valentine? ❤️</h1>
    <div class="buttons">
        <button class="yes" id="yesButton" onclick="yesClicked()">Yes</button>
        <button class="no" id="noButton" onclick="noClicked()">No</button>
    </div>
    
    <script>
        let clickCount = 0;
        let backgrounds = [
            'snoopy1.jpg', 'snoopy2.jpg', 'snoopy3.jpg',
            'sadcat1.jpg', 'sadcat2.jpg', 'sadcat3.jpg'
        ];
        let noTexts = [
            'Are you sure? 😢', 'Really? 🥺', 'Think again... 😭',
            'No isn’t an option! 😡', 'PLEASE DON’T DO THIS 😱',
            'I CAN’T GO ON WITHOUT YOU 💀', 'YOU ARE BREAKING MY HEART 💔'
        ];
        let funnySounds = [
            'vine-boom.mp3', 'windows-xp-error.mp3', 'sad-trombone.mp3'
        ];
        
        function playSound(url) {
            let audio = new Audio(url);
            audio.play();
        }
        
        function startMusic() {
            let music = document.getElementById("snoopyMusic");
            music.play();
        }
        
        function noClicked() {
            if (clickCount === 0) startMusic();
            clickCount++;
            let randomBg = backgrounds[Math.floor(Math.random() * backgrounds.length)];
            document.body.style.backgroundImage = `url('${randomBg}')`;
            let newText = noTexts[Math.min(clickCount, noTexts.length - 1)];
            document.getElementById('noButton').innerText = newText;
            playSound(funnySounds[Math.floor(Math.random() * funnySounds.length)]);
            document.getElementById('yesButton').style.transform = `scale(${1 + clickCount * 0.3})`;
        }
        
        function yesClicked() {
            playSound('tada.mp3');
            document.body.innerHTML = `
                <h1>YAY! I LOVE YOU! ❤️</h1>
                <p style="font-size: 1.5em; color: #b22222; text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);">Happy 6th Valentine’s together! I am so grateful for every moment we’ve spent together, and I can’t wait for many more. 
                You inspire me every day, and I will always support you in achieving your dreams and our dreams together. 
                You are my world, and I love you endlessly! ❤️
                Hey Allie,
                It’s kinda crazy to think we’ve been together for over five years now. Like, how did we go from cramming for exams at Berkeley with boba and popcorn chicken to navigating full-time jobs and talking about our future together? Time really flies, but honestly, I wouldn’t want to spend it with anyone else but you.
                Looking back at our time at Berkeley, I realize just how much we’ve grown. I’ve seen you become more confident, more sure of yourself, and I can’t tell you how proud that makes me. And honestly, I know I wouldn’t be who I am today without you. You’ve taught me patience (which, let’s be real, I desperately needed), and how to find happiness in the little things—like our late-night talks that went way too deep for 2 a.m. or just laughing over the dumbest stuff while sharing a snack. Those moments meant everything to me, and they still do.
                Now, we’re in this whole new phase—adulting. You’re out here grinding at BCG, putting in those wild hours, while I’m chilling a little more with my tech job. But no matter how crazy life gets, we still find time for the things that matter—our weekend farmer’s market trips, our K-drama marathons, and chasing after our dreams. Seeing you work toward building your own food brand makes me so excited for you. I know you’re going to crush it, and I want to be there for every part of it—whether that means washing dishes, managing spreadsheets, or just hyping you up when you need it. Whatever role you need me in, I’m there.
                And I have a few promises to make—small ones, but ones that mean a lot.
                I promise to always get up and throw away your contacts when you forget, even if I’m half-asleep too.
                I promise to take off your socks when you knock out wearing them because I know you hate it.
                I promise to do your laundry when work gets crazy and you don’t have time.
                I promise to remind you how amazing you are, especially when you’re doubting yourself.
                I promise to keep getting boba and popcorn chicken with you, even when we’re old and wrinkly
                And most of all, I promise to love you—through everything, always.
                You’re my best friend, my favorite person, and the love of my life. No matter where life takes us, I know we’ll always have each other. And that’s all I’ll ever need.
                Love you always,
                Anthony</p>
                <div style="font-size: 3em;">🎉🎉🎉</div>
            `;
        }
    </script>
</body>
</html>
